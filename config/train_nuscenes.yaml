# ============================================================
# Mamba-Decoupled-EKF Track — Training Configuration (nuScenes)
# ============================================================

FILTER_MODE: mamba_multihead_closure   # explicit runtime-contract target for prior-conditioned closure training

# ---- Data ----
DATA:
  NUSC_VERSION: v1.0-trainval
  NUSC_DATAROOT: /home/alvin/datasets/track_data/nuscenes/datasets/
  TRAIN_SPLIT: train
  VAL_SPLIT: val
  TRAIN_SOURCE: det         # gt / det
  VAL_SOURCE: det           # gt / det
  TRACKLET_CACHE_DIR: /home/alvin/datasets/track_data/training_cache/nuscenes/
  TRAIN_TRACKLET_PKL: /home/alvin/datasets/track_data/training_cache/nuscenes/mini/train_fusion.pkl  # training cache with fusion history
  VAL_TRACKLET_PKL: /home/alvin/datasets/track_data/training_cache/nuscenes/mini/val_fusion.pkl      # held-out validation cache; generate before formal training
  HISTORY_SOURCE: fusion    # det / fusion
  INIT_STATE_SOURCE: fusion # det / fusion
  TRAIN_TRACKER_COMPAT_MODE: mctrack  # default / mctrack (saved into checkpoint runtime contract)
  STATE_OUTPUT_MODE: filter # independent of MCTrack lifecycle; never overwrite learned state
  FUSION_FEATURE_SCHEMA_VERSION: 2 # birth/rebirth angular velocity follows online initialization
  EXPECTED_BEV_COST_MODE: geometric   # saved into checkpoint runtime contract for inference-side consistency checks
  FUSION_MAX_PREDICT_LEN: 3 # used by tools/augment_tracklet_cache_with_fusion.py for local coast rollout
  REQUIRE_CURRENT_MATCH: false # include live coasted histories; never initialize misses from GT
  MIN_HISTORY_MATCH_RATIO: 0.25
  TRAIN_ADAPTIVE_WINDOWS: true
  INCLUDE_SHORT_HISTORIES: true # supervise startup/rebirth prefixes, including one-frame histories
  VAL_ADAPTIVE_WINDOWS: false
  MIN_HISTORY_LEN: 4
  MIN_ROLLOUT_STEPS: 2
  CLASS_WINDOW:
    car:
      MIN_HISTORY_LEN: 4
      MAX_HISTORY_LEN: 8
      MIN_ROLLOUT_STEPS: 2
      MAX_ROLLOUT_STEPS: 8
    bicycle:
      MIN_HISTORY_LEN: 3
      MAX_HISTORY_LEN: 6
      MIN_ROLLOUT_STEPS: 2
      MAX_ROLLOUT_STEPS: 6
    motorcycle:
      MIN_HISTORY_LEN: 3
      MAX_HISTORY_LEN: 6
      MIN_ROLLOUT_STEPS: 2
      MAX_ROLLOUT_STEPS: 6
    pedestrian:
      MIN_HISTORY_LEN: 4
      MAX_HISTORY_LEN: 7
      MIN_ROLLOUT_STEPS: 2
      MAX_ROLLOUT_STEPS: 8
    bus:
      MIN_HISTORY_LEN: 4
      MAX_HISTORY_LEN: 8
      MIN_ROLLOUT_STEPS: 2
      MAX_ROLLOUT_STEPS: 8
    trailer:
      MIN_HISTORY_LEN: 5
      MAX_HISTORY_LEN: 8
      MIN_ROLLOUT_STEPS: 2
      MAX_ROLLOUT_STEPS: 8
    truck:
      MIN_HISTORY_LEN: 4
      MAX_HISTORY_LEN: 8
      MIN_ROLLOUT_STEPS: 2
      MAX_ROLLOUT_STEPS: 8
  CATEGORY_FILTER: null   # null = all categories; or ["car", "pedestrian"]

# ---- Model (TemporalMamba) ----
# Mamba-2 backbone. Parameter count is logged at startup because it depends on
# d_state/headdim/ngroups and should not reuse the old Mamba-1 estimates.
MODEL:
  BACKBONE: mamba2
  # ---- Active Mamba-2 backbone ----
  D_MODEL: 96
  D_STATE: 64
  D_CONV: 4
  EXPAND: 2
  MAMBA2_HEADDIM: 64
  MAMBA2_NGROUPS: 1
  N_MAMBA_LAYERS: 6
  EMBED_DIM: 64
  HISTORY_LEN: 8            # max history length; adaptive training may sample shorter valid suffixes
  INPUT_HISTORY_SOURCE: track # must match inference MAMBA.INPUT_HISTORY_SOURCE
  NUM_CLASSES: 7             # nuScenes tracking classes with independent closure heads
  MIN_DIAG_Q: 0.1           # floor on Cholesky diagonal for position Q head
  MIN_DIAG_R: 0.1           # floor on Cholesky diagonal for position R head
  MIN_DIAG_SIZ: 0.15        # floor on size noise diagonal (prevents NLL→-∞ collapse)
  MIN_KAPPA: 0.5            # floor on kappa (prevents R_ori→∞, degenerate kappa→0)

MAMBA_ASSOCIATION_PRIOR:
  ENABLED: false
  MAX_DELTA: 0.05
  DET_SCORE_WEIGHT: 0.0
  MIN_DET_SCORE: 0.0
  ACTIVE_CLASS_STATES:
    0: ["matched", "unmatched"]
    1: ["matched", "unmatched"]
    2: ["matched", "unmatched"]
    3: ["matched", "unmatched"]
    4: ["matched", "unmatched"]
    5: ["matched", "unmatched"]
    6: ["matched", "unmatched"]
  ALPHA:
    0: {matched: 0.03, unmatched: 0.05}
    1: {matched: 0.03, unmatched: 0.05}
    2: {matched: 0.05, unmatched: 0.08}
    3: {matched: 0.05, unmatched: 0.08}
    4: {matched: 0.03, unmatched: 0.04}
    5: {matched: 0.04, unmatched: 0.06}
    6: {matched: 0.03, unmatched: 0.05}

ASSOCIATION_HEAD_TRAINING:
  ENABLED: true
  RUN_AFTER_MAIN: true
  REQUIRE_FEATURE_SCHEMA_VERSION: 3
  TRAIN_PAIRWISE_PKL: /home/alvin/datasets/track_data/training_cache/nuscenes/mini/train_pairwise_assoc.pkl
  VAL_PAIRWISE_PKL: /home/alvin/datasets/track_data/training_cache/nuscenes/mini/val_pairwise_assoc.pkl
  OUTPUT: /home/alvin/datasets/track_data/checkpoints/mamba_motion/best_assoc.pt
  METRICS_OUTPUT: /home/alvin/datasets/track_data/checkpoints/mamba_motion/pairwise_assoc_metrics.json
  BACKBONE_CHECKPOINT: /home/alvin/datasets/track_data/checkpoints/mamba_motion/best.pt
  FREEZE_BACKBONE: true
  PRECOMPUTE_EMBEDDINGS: true
  TRAIN_MODE: per_class          # independently optimize/select each class head on one frozen shared backbone
  CLASS_IDS: [0, 1, 2, 3, 4, 5, 6]
  REQUIRE_ALL_CLASSES: true      # never ship a randomly initialized category head silently
  TENSORBOARD_DIR: /home/alvin/datasets/track_data/checkpoints/mamba_motion/assoc_tb
  EPOCHS: 20
  BATCH_SIZE: 256
  NUM_WORKERS: 0
  LOG_EVERY: 10
  LR: 1.0e-4
  WEIGHT_DECAY: 1.0e-4
  HIDDEN_DIMS: [256, 128]
  DROPOUT: 0.1
  HARD_NEGATIVE_WEIGHT: 2.0
  RANKING_MARGIN: 0.2
  RANKING_WEIGHT: 0.1
  LISTWISE_WEIGHT: 0.5       # optimize the complete same-frame candidate set, not isolated pairs
  BALANCE_POSITIVES: true    # zero logit remains a neutral association factor under one-positive/many-negative groups

# ---- Training ----
TRAINING:
  BATCH_SIZE: 128             # global batch; torchrun with 2 GPUs uses 64 per GPU
  NUM_WORKERS: 4              # per GPU; reduce to 2 if host RAM/CPU is constrained
  SEED: 0
  EPOCHS: 100
  LR: 5.0e-4                # base LR for projection/head layers; slightly lower to stabilise head/noise coupling
  MAMBA_LR: 3.0e-5          # conservative starting LR for the 6-layer Mamba-2 backbone
  WEIGHT_DECAY: 1.0e-4
  WARMUP_EPOCHS: 3             # LR scheduler warmup
  WARMUP_UNCERTAINTY_EPOCHS: 8 # detach Q/R/kappa longer so state backbone stabilises before uncertainty learning
  WARMUP_TRANSITION_EPOCHS: 8  # slower smooth unfreeze (alpha ramp 0->1) after uncertainty warmup
  GRAD_CLIP_NORM: 1.0
  LOG_EVERY: 50
  SAVE_EVERY: 10
  SAVE_DIR: /home/alvin/datasets/track_data/checkpoints/mamba_motion/
  REQUIRE_MAMBA_SSM: true        # fail fast if training would fall back to GRU
  AUTO_UNSEAL_EPOCH: 0           # disabled for bounded-residual closure training; avoid unrelated cost-mode mutations
  INFERENCE_CONFIG: config/nuscenes_single_stage_mctrack_motion_residual_combo.yaml
  ROLLOUT_STEPS: 8               # train true multi-step coast prediction, not one-step denoising
  NOISE_MAP:                     # Category-specific noise injection (aligned to inference DEKF_BASE_NOISE.R)
    # Order: [Car, Pedestrian, Bicycle, Motorcycle, Bus, Trailer, Truck]
    POS_STD_XY:
      - [0.5210, 0.5045]
      - [0.2745, 0.2731]
      - [0.5562, 0.5444]
      - [0.8646, 0.8695]
      - [1.2247, 1.2247]
      - [1.4142, 1.4142]
      - [1.2247, 1.2247]
    SIZ_STD_LW:
      - [0.2417, 0.0799]
      - [0.0567, 0.0422]
      - [0.1118, 0.0661]
      - [0.1866, 0.0860]
      - [1.4142, 1.4142]
      - [1.4142, 1.4142]
      - [1.4142, 1.4142]
    VEL_STD_XY:
      - [0.7551, 0.7017]
      - [0.2494, 0.2409]
      - [0.3933, 0.3942]
      - [0.8261, 0.8865]
      - [22.3607, 22.3607]
      - [1.5811, 1.5811]
      - [2.0000, 2.0000]
    ORI_STD: [0.1823, 0.0304, 0.1540, 0.0609, 0.4472, 0.4472, 0.4472]
    MEAS_MULTIPLIER: 1.0

BASE_NOISE:
  Q:
    POS: [0.5, 0.5, 0.5, 1.5, 1.5, 1.5]
    POS_PER_CAT:
      0: [0.2, 0.2, 0.2, 1.0, 1.0, 1.0]
      1: [1.5, 1.5, 1.5, 1.5, 1.5, 1.5]
      2: [0.3, 0.3, 0.3, 1.0, 1.0, 1.0]
      3: [0.5, 0.5, 0.5, 4.0, 4.0, 4.0]
      4: [0.5, 0.5, 0.5, 1.5, 1.5, 1.5]
      5: [0.3, 0.3, 0.3, 0.1, 0.1, 0.1]
      6: [0.1, 0.1, 0.1, 2.0, 2.0, 2.0]
    SIZ: [0.05, 0.05, 0.05]
    ORI: [0.1]
  R:
    POS_STD_XY:
      - [0.5210, 0.5045]
      - [0.2745, 0.2731]
      - [0.5562, 0.5444]
      - [0.8646, 0.8695]
      - [1.2247, 1.2247]
      - [1.4142, 1.4142]
      - [1.2247, 1.2247]
    SIZ_STD_LW:
      - [0.2417, 0.0799]
      - [0.0567, 0.0422]
      - [0.1118, 0.0661]
      - [0.1866, 0.0860]
      - [1.4142, 1.4142]
      - [1.4142, 1.4142]
      - [1.4142, 1.4142]
    VEL_STD_XY:
      - [0.7551, 0.7017]
      - [0.2494, 0.2409]
      - [0.3933, 0.3942]
      - [0.8261, 0.8865]
      - [22.3607, 22.3607]
      - [1.5811, 1.5811]
      - [2.0000, 2.0000]
    ORI_STD: [0.1823, 0.0304, 0.1540, 0.0609, 0.4472, 0.4472, 0.4472]
  CONDITIONAL_NOISE:
    ENABLED: true
    SCORE_WEIGHT: 0.8
    MISS_WEIGHT: 0.8
    RANGE_WEIGHT: 0.3
    SPEED_WEIGHT: 0.2
    YAW_RATE_WEIGHT: 0.2
    SIZE_SCORE_WEIGHT: 0.4
    SIZE_MISS_WEIGHT: 0.2
    RANGE_REF: 30.0
    SPEED_REF: 15.0
    YAW_RATE_REF: 0.5
    MIN_SCALE: 0.75
    MAX_SCALE: 2.5
  RESIDUAL_ANCHOR:
    ENABLED: true
    TARGETS: ["Q_pos", "R_pos", "R_siz", "R_ori"]
    MIN_STD_RATIO: 0.60
    MAX_STD_RATIO: 1.80
  MAMBA_CLOSURE:
    ENABLED: true
    MODE: prior_conditioned_multihead
    USE_CONDITIONAL_PRIOR: false
    FORCE_COAST_PRIOR_ONLY: false
    FORCE_PRIOR_STATES: []
    TRAIN_ALL_CLASS_STATES: true
    ACTIVE_CLASS_STATES: {}
    TRAIN_MATCHED_HEAD:
      ENABLED: true
    MATCHED_KF_BAND:
      ENABLED: true
      FAMILIES:
        q_pos: [0.92, 1.08]
        r_pos: [0.92, 1.08]
        r_siz: [0.94, 1.06]
        r_ori: [0.92, 1.10]
      CLASS_OVERRIDES:
        2:
          q_pos: [0.90, 1.10]
          r_pos: [0.90, 1.10]
          r_ori: [0.90, 1.12]
        3:
          q_pos: [0.90, 1.10]
          r_pos: [0.90, 1.10]
          r_ori: [0.90, 1.12]
        5:
          q_pos: [0.94, 1.06]
          r_pos: [0.94, 1.06]
          r_siz: [0.95, 1.05]
          r_ori: [0.94, 1.08]
        6:
          q_pos: [0.92, 1.08]
          r_pos: [0.92, 1.08]
          r_siz: [0.94, 1.06]
          r_ori: [0.92, 1.10]
    RATIO_ANCHOR_WEIGHT: 0.04
    RATIO_BOUND_WEIGHT: 0.08
    RATIO_BOUND_LOWER_WEIGHT: 0.25
    RATIO_BOUND_UPPER_WEIGHT: 1.0
    ORI_WARMUP_EPOCHS: 8
    ORI_TRANSITION_EPOCHS: 8
    ORI_STATE_WEIGHT: 1.0
    ORI_WRAPPED_NLL_WEIGHT: 1.0
    ORI_SATURATION_REG_WEIGHT: 0.0 # closure uses bounded prior ratios, not a global kappa ceiling
    ORI_MAX_EFFECTIVE_KAPPA: 5.0
    PROFILES:
      stable_large:
        matched:
          q_pos: [0.70, 1.80]
          r_pos: [0.70, 2.20]
          r_siz: [0.70, 2.20]
          r_ori: [0.70, 3.20]
        unmatched:
          q_pos: [0.80, 1.50]
          r_pos: [0.80, 1.45]
          r_siz: [0.80, 1.60]
          r_ori: [0.80, 2.80]
      agile_weak:
        matched:
          q_pos: [0.75, 1.65]
          r_pos: [0.75, 1.90]
          r_siz: [0.75, 1.90]
          r_ori: [0.75, 3.00]
        unmatched:
          q_pos: [0.85, 1.40]
          r_pos: [0.85, 1.35]
          r_siz: [0.85, 1.50]
          r_ori: [0.85, 2.60]
      heavy_long:
        matched:
          q_pos: [0.70, 1.90]
          r_pos: [0.70, 2.30]
          r_siz: [0.70, 2.10]
          r_ori: [0.70, 3.00]
        unmatched:
          q_pos: [0.80, 1.45]
          r_pos: [0.80, 1.35]
          r_siz: [0.80, 1.50]
          r_ori: [0.80, 2.50]
      human:
        matched:
          q_pos: [0.75, 1.75]
          r_pos: [0.75, 2.00]
          r_siz: [0.75, 2.00]
          r_ori: [0.75, 3.20]
        unmatched:
          q_pos: [0.85, 1.45]
          r_pos: [0.85, 1.40]
          r_siz: [0.85, 1.55]
          r_ori: [0.85, 2.80]
  MAMBA_STATE_RESIDUAL:
    ENABLED: true
    BOUNDING_MODE: tanh
    TIME_SCALING: true
    REFERENCE_DT: 0.5
    MIN_TIME_SCALE: 0.5
    MAX_TIME_SCALE: 2.0
    ACTIVE_CLASS_STATES:
      0: ["matched", "unmatched"]
      1: ["matched", "unmatched"]
      2: ["matched", "unmatched"]
      3: ["matched", "unmatched"]
      4: ["matched", "unmatched"]
      5: ["matched", "unmatched"]
      6: ["matched", "unmatched"]
    DEFAULT_BOUNDS:
      POS_XY: 0.75
      POS_Z: 0.15
      VEL_XY: 1.50
      YAW: 0.25
    CLASS_BOUNDS:
      0:
        matched: {POS_XY: 0.75, POS_Z: 0.12, VEL_XY: 1.50, YAW: 0.20}
        unmatched: {POS_XY: 0.75, POS_Z: 0.12, VEL_XY: 1.50, YAW: 0.20}
      1:
        matched: {POS_XY: 0.40, POS_Z: 0.08, VEL_XY: 1.00, YAW: 0.40}
        unmatched: {POS_XY: 0.40, POS_Z: 0.08, VEL_XY: 1.00, YAW: 0.40}
      2:
        matched: {POS_XY: 0.70, POS_Z: 0.10, VEL_XY: 2.00, YAW: 0.35}
        unmatched: {POS_XY: 0.70, POS_Z: 0.10, VEL_XY: 2.00, YAW: 0.35}
      3:
        matched: {POS_XY: 1.00, POS_Z: 0.12, VEL_XY: 3.00, YAW: 0.35}
        unmatched: {POS_XY: 1.00, POS_Z: 0.12, VEL_XY: 3.00, YAW: 0.35}
      4:
        matched: {POS_XY: 0.60, POS_Z: 0.12, VEL_XY: 1.00, YAW: 0.15}
        unmatched: {POS_XY: 0.60, POS_Z: 0.12, VEL_XY: 1.00, YAW: 0.15}
      5:
        matched: {POS_XY: 0.60, POS_Z: 0.12, VEL_XY: 1.00, YAW: 0.15}
        unmatched: {POS_XY: 0.60, POS_Z: 0.12, VEL_XY: 1.00, YAW: 0.15}
      6:
        matched: {POS_XY: 0.70, POS_Z: 0.12, VEL_XY: 1.50, YAW: 0.18}
        unmatched: {POS_XY: 0.70, POS_Z: 0.12, VEL_XY: 1.50, YAW: 0.18}
  MOTION_ROLLOUT:
    ENABLED: true
    TRAIN_OPEN_LOOP_PROB: 0.70
    TRAIN_MIN_COAST_STEPS: 2
    TRAIN_MAX_COAST_STEPS: 8
    VALIDATION_OPEN_LOOP: true
    WEIGHT: 2.0
    W_POS: 2.0
    W_VEL: 0.5
    W_YAW: 0.5
    FINAL_STEP_WEIGHT: 2.0
    REG_WEIGHT: 0.002
  DETECTION_UPDATE:
    ENABLED: true
    MISS_R_SCALE: 1000.0
  MCTRACK_EXACT_UPDATE:
    MATCHED_CLASSES: [5, 6]
    UNMATCHED_CLASSES: [5, 6]

AUDIT:
  NOISE_AUDIT:
    ENABLED: false
    STRICT: false
    TRAIN_OUTPUT_PATH: debug/train_noise_audit.json

# ---- Loss ----
LOSS:
  W_POS: 5.0
  W_SIZ: 1.0            # reduced: raw_r_siz init is very negative, don't amplify
  W_ORI: 1.5            # Von Mises NLL range ~0.1-1.0, no need for 50x
  W_VEL: 0.3            # velocity NLL weight (≤ W_POS; constant-vel GT is approximate)
  W_NIS: 0.1            # NIS calibration weight (innovation consistency)
  VEL_WARMUP_EPOCHS: 1  # delay vel NLL for first N epochs after uncertainty-unseal
  LAMBDA_CONTRAST: 0.15
  INFONCE_TEMPERATURE: 0.07
  HARD_NEGATIVE_TOPK: 32
  RESIDUAL_SUPERVISION:
    ENABLED: false  # replaced by recursive multi-step MOTION_ROLLOUT loss
    WEIGHT: 0.0
    W_POS_XY: 1.0
    W_POS_Z: 0.3
    W_VEL_XY: 0.5
    W_YAW: 0.5
  ASSOCIATION_SUPERVISION:
    ENABLED: true
    WEIGHT: 0.02
    MARGIN: 0.20
    HARD_NEGATIVE_TOPK: 4
  # Class reweighting for hard/noisy categories:
  # [car, pedestrian, bicycle, motorcycle, bus, trailer, truck]
  CLASS_WEIGHTS: [1.0, 1.05, 2.0, 2.0, 1.1, 1.8, 1.2]
  PHYSICS_SCALE: 5.0    # reduced from 20: let pos gradient survive against siz
